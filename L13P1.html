<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My School Club Website</title>
    
<link rel="stylesheet"

href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
<style>
    body {
        background-color: #FFADEE;
        padding: 20px;
    }

    h1 {
        text-align: center;
        color: #F62477;
    }
    .club-card {
        background-color: #F62477;
        color: black;
        padding: 20px;
        margin: 10px;
        border-radius: 10px;
        text-align: center;
        font-family: cursive;
    }
    .club-card:hover {
        background-color: #FFE185;
        transform: scale(1.10);
    }

    .col-12 {
        margin-bottom: 20px;
        text-align: center;
        font-family: cursive;
    }

</style>
</head>
<body>
    <center>
    <h1>My School Clubs</h1>
</center>
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="club-card">
                    <h2>Coding Club</h2>
                    <p>I learn to code and build cool projects!</p>
                </div>
            </div>
            <div class="col-12 col-md-12 col-lg-4">
                <div class="club-card">
                    <h2>Debate Club</h2>
                    <p>I learn to debate and express my opinions!</p>
                </div>
            </div>
            <div class="col-12 col-md-12 col-lg-4">
                <div class="club-card">
                    <h2>German Club</h2>
                    <p>I learn to speak and write in German!</p>
                </div>
            </div>
            <div class="school-website">
                <a href="https://bbpsrohini.balbharati.org/">Tap here to view my school's website for more information</a>
            </div>
        </div>
    </div>

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">

</script>
</body>
</html>
